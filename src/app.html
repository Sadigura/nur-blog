<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Padrão do site é sempre o modo claro (creme); o escuro só
			// entra se a pessoa escolheu manualmente antes (localStorage).
			// Isso roda antes da pintura pra não piscar o tema errado.
			try {
				if (localStorage.getItem('nur-theme') === 'dark') {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
