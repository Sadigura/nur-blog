name: Deploy site do NUR para o GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # TEMPORÁRIO: enquanto nur-unifesp.com.br não está no ar, o site é
          # servido em sadigura.github.io/nur-blog/ (subcaminho). Assim que o
          # domínio próprio estiver ativo (CNAME + DNS resolvendo), apague
          # esta linha (ou deixe BASE_PATH vazio) pra voltar a apontar pra
          # raiz do domínio — ver vite.config.ts.
          BASE_PATH: /nur-blog
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
